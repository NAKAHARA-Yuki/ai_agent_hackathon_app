services:
  agent:
    build:
      context: ./agent
    container_name: izatabi-agent
    ports:
      - "8080:8080"
    env_file:
      - ./server/.env
    environment:
      # Model/API keys are supplied via env_file (./server/.env)
      - LOG_LEVEL=DEBUG
      # Allow local dev UIs
      - CORS_ALLOW_ORIGINS=http://localhost:5173,http://localhost:4200
    # Use Dockerfile default CMD (adk api_server ... ./agents/root_coordinator)