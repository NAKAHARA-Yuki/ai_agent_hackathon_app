services:
  server:
    image: python:3.12-slim
    container_name: izatabi-server
    working_dir: /app/server
    volumes:
      - ./server:/app/server
      - ./client/dist:/app/client/dist:ro
      - ./shared:/app/shared:ro
    env_file:
      - ./server/.env
    environment:
      - FLASK_ENV=development
      - USE_MOCK_DATA=true
      - CLIENT_DIST=/app/client/dist
      # Server -> Agent 内部通信（composeネットワーク名）
      - AGENT_BASE_URL=http://agent:8080
    depends_on:
      - client-build
      - agent
    ports:
      - "8080:8080"
    command: bash -lc "pip install -r requirements.txt && python3 app.py"
    restart: unless-stopped

  agent:
    build:
      context: ./agent
    container_name: izatabi-agent
    ports:
      - "8082:8080"  # ホスト側は8082に変更（8080はserverが使用）
    env_file:
      - ./server/.env
    environment:
      # Model/API keys are supplied via env_file (./server/.env)
      - LOG_LEVEL=DEBUG
      # Allow local dev UIs
      - CORS_ALLOW_ORIGINS=http://localhost:5173,http://localhost:4200
      # google-genai(ADK) は GOOGLE_API_KEY を参照するため、GEMINI_API_KEY をエイリアスで渡す
      - GOOGLE_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped

  client-build:
    image: node:20-alpine
    container_name: izatabi-client-build
    working_dir: /app
    volumes:
      - ./client:/app
    command: sh -lc "npm ci && npm run build"
    environment:
      - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY}
      - VITE_GOOGLE_MAPS_MAP_ID=${VITE_GOOGLE_MAPS_MAP_ID}
      - VITE_ENABLE_ADVANCED_MARKER=${VITE_ENABLE_ADVANCED_MARKER}
