name: Deploy to Cloud Run (dev)

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

# Secret strategy (dev): 全て本番と共通の GitHub Secrets を利用します。
#  - 理由: シンプルさと管理コスト削減を優先。dev ブランチはサービス名 suffix (-dev) のみで分離。
#  - 影響: 同一プロジェクト/SA/リポジトリを共有するため、dev デプロイはリソース操作で本番と衝突しないようサービス名を常に -dev 付きで維持。
#  - 将来分離したくなった場合: *_DEV 変数を再導入し、env/secret 参照を書き換えることで対応可能。

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-dev
  cancel-in-progress: true

jobs:
  agent-and-mcp-dev:
    if: github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch'
    name: Build and Deploy Agent + MCP (dev)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      agent_url: ${{ steps.resolve_agent_url.outputs.agent_url }}
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: ${{ secrets.CLOUD_RUN_REGION }}
      REPO_AGENT: ${{ secrets.ARTIFACT_REGISTRY_REPO_AGENT }}
      APP_ENV: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          export_default_credentials: true

      - name: Configure Docker auth for Artifact Registry
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev -q

      - name: Ensure Artifact Registry repository exists (agent dev)
        env:
          REGION: ${{ env.REGION }}
          PROJECT_ID: ${{ env.PROJECT_ID }}
          REPO_PATH: ${{ env.REPO_AGENT }}
        run: |
          set -e
          REPO_NAME=$(echo "${REPO_PATH}" | awk -F'/' '{print $2}')
          if [ -z "${REPO_NAME}" ]; then
            echo "ARTIFACT_REGISTRY_REPO_AGENT_DEV must be '<PROJECT_ID>/<REPOSITORY_NAME>'" >&2
            exit 1
          fi
          if ! gcloud artifacts repositories describe "${REPO_NAME}" --location="${REGION}" >/dev/null 2>&1; then
            echo "Creating Artifact Registry repo: ${REPO_NAME} in ${REGION} (dev)"
            if ! gcloud artifacts repositories create "${REPO_NAME}" \
                --repository-format=docker \
                --location="${REGION}" \
                --description="ai_agent_hackathon_app agent images (dev)"; then
              echo "WARN: Could not create Artifact Registry repo for dev agent." >&2
            fi
          else
            echo "Artifact Registry repo exists: ${REPO_NAME} (${REGION})"
          fi

      - name: Build and push images (Agent + MCP dev)
        env:
          REGION: ${{ env.REGION }}
          REPO_PATH: ${{ env.REPO_AGENT }}
        run: |
          set -e
          AGENT_IMAGE=${REGION}-docker.pkg.dev/${REPO_PATH}/travel-agent-service-dev:${GITHUB_SHA}
          MCP_IMAGE=${REGION}-docker.pkg.dev/${REPO_PATH}/maps-mcp-service-dev:${GITHUB_SHA}
          docker build -t ${AGENT_IMAGE} agent
          docker build -t ${MCP_IMAGE} mcp
          docker push ${AGENT_IMAGE}
          docker push ${MCP_IMAGE}

      - name: Deploy Agent (dev)
        env:
          REGION: ${{ env.REGION }}
        run: |
          AGENT_IMAGE=${REGION}-docker.pkg.dev/${{ env.REPO_AGENT }}/travel-agent-service-dev:${GITHUB_SHA}
          gcloud run deploy travel-agent-service-dev \
            --image ${AGENT_IMAGE} \
            --region ${REGION} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars=APP_ENV=development,GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},GEMINI_MODEL=gemini-2.5-pro,GOOGLE_GENAI_USE_VERTEXAI=TRUE,VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Resolve Agent URL (dev)
        id: resolve_agent_url
        env:
          REGION: ${{ env.REGION }}
        run: |
          set -e
          URL=$(gcloud run services describe travel-agent-service-dev --region ${REGION} --format 'value(status.url)')
          echo "agent_url=${URL}" >> $GITHUB_OUTPUT

  build-and-deploy-dev:
    needs: agent-and-mcp-dev
    if: github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch'
    name: Build and Deploy App (dev)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: ${{ secrets.CLOUD_RUN_REGION }}
      SERVICE: travel-quiz-app-dev
      REPO: ${{ secrets.ARTIFACT_REGISTRY_REPO_APP }}
      IMAGE: ${{ secrets.ARTIFACT_REGISTRY_REPO_APP }}/travel-quiz-app-dev:${{ github.sha }}
      APP_ENV: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          export_default_credentials: true

      - name: Configure Docker auth for Artifact Registry
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev -q

      - name: Ensure Artifact Registry repository exists (app dev)
        env:
          REGION: ${{ env.REGION }}
          PROJECT_ID: ${{ env.PROJECT_ID }}
          REPO_PATH: ${{ env.REPO }}
        run: |
          set -e
          REPO_NAME=$(echo "${REPO_PATH}" | awk -F'/' '{print $2}')
          if [ -z "${REPO_NAME}" ]; then
            echo "ARTIFACT_REGISTRY_REPO_APP_DEV must be '<PROJECT_ID>/<REPOSITORY_NAME>'" >&2
            exit 1
          fi
          if ! gcloud artifacts repositories describe "${REPO_NAME}" --location="${REGION}" >/dev/null 2>&1; then
            echo "Creating Artifact Registry repo: ${REPO_NAME} in ${REGION} (dev)"
            if ! gcloud artifacts repositories create "${REPO_NAME}" \
                --repository-format=docker \
                --location="${REGION}" \
                --description="ai_agent_hackathon_app images (dev)"; then
              echo "WARN: No permission to create Artifact Registry dev repo." >&2
            fi
          else
            echo "Artifact Registry repo exists: ${REPO_NAME} (${REGION})"
          fi

      - name: Build Docker image (dev)
        run: |
          docker build -t ${REGION}-docker.pkg.dev/${IMAGE} .

      - name: Push Docker image (dev)
        run: |
          docker push ${REGION}-docker.pkg.dev/${IMAGE}

      - name: Deploy App (dev)
        run: |
          gcloud run deploy ${SERVICE} \
            --image=${REGION}-docker.pkg.dev/${IMAGE} \
            --region=${REGION} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --max-instances=2 \
            --set-env-vars=APP_ENV=development,GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},JWT_SECRET=${{ secrets.JWT_SECRET }},GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }},AGENT_BASE_URL=${{ needs.agent-and-mcp-dev.outputs.agent_url }}

      - name: Resolve App URL (dev)
        id: resolve_app_url
        env:
          REGION: ${{ env.REGION }}
          SERVICE: ${{ env.SERVICE }}
        run: |
          set -e
          APP_URL=$(gcloud run services describe ${SERVICE} --region ${REGION} --format 'value(status.url)')
          echo "app_url=${APP_URL}" >> $GITHUB_OUTPUT

      - name: Update Agent with APP_SERVER_BASE (dev)
        env:
          REGION: ${{ env.REGION }}
          APP_URL: ${{ steps.resolve_app_url.outputs.app_url }}
        run: |
          set -e
          gcloud run services update travel-agent-service-dev \
            --region ${REGION} \
            --update-env-vars=APP_SERVER_BASE=${APP_URL}
