name: Deploy Agent (Cloud Run)

on:
  pull_request:
    branches: [ main ]
    types: [ closed ]
    paths:
      - 'agent/**'
      - 'mcp/**'
      - '.github/workflows/deploy-agent-cloud-run.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
  # Run on manual dispatch OR when a PR to main is merged
  if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up gcloud auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Configure gcloud project
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker auth (Artifact Registry)
        env:
          REGION: ${{ secrets.CLOUD_RUN_REGION }}
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Ensure Artifact Registry repository exists
        env:
          REGION: ${{ secrets.CLOUD_RUN_REGION }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REPO_PATH: ${{ secrets.ARTIFACT_REGISTRY_REPO_AGENT }}
        run: |
          set -e
          REPO_NAME=$(echo "${REPO_PATH}" | awk -F'/' '{print $2}')
          if [ -z "${REPO_NAME}" ]; then
            echo "ARTIFACT_REGISTRY_REPO must be '<PROJECT_ID>/<REPOSITORY_NAME>' (e.g., my-proj/containers)" >&2
            exit 1
          fi
          if ! gcloud artifacts repositories describe "${REPO_NAME}" --location="${REGION}" >/dev/null 2>&1; then
            echo "Creating Artifact Registry repo: ${REPO_NAME} in ${REGION}"
            if ! gcloud artifacts repositories create "${REPO_NAME}" \
                --repository-format=docker \
                --location="${REGION}" \
                --description="ai_agent_hackathon_app images"; then
              echo "WARN: No permission to create Artifact Registry repo. Please pre-create '${REPO_NAME}' or grant 'roles/artifactregistry.admin' to the deploying SA." >&2
            fi
          else
            echo "Artifact Registry repo exists: ${REPO_NAME} (${REGION})"
          fi

      - name: Build and push images (Agent + MCP)
        env:
          REGION: ${{ secrets.CLOUD_RUN_REGION }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REPO_PATH: ${{ secrets.ARTIFACT_REGISTRY_REPO_AGENT }} # e.g. <PROJECT_ID>/<REPOSITORY_NAME>
        run: |
          AGENT_IMAGE=${REGION}-docker.pkg.dev/${REPO_PATH}/travel-agent-service:${GITHUB_SHA}
          MCP_IMAGE=${REGION}-docker.pkg.dev/${REPO_PATH}/maps-mcp-service:${GITHUB_SHA}
          docker build -t ${AGENT_IMAGE} agent
          docker build -t ${MCP_IMAGE} mcp
          docker push ${AGENT_IMAGE}
          docker push ${MCP_IMAGE}

      - name: Deploy MCP to Cloud Run (auth required)
        env:
          REGION: ${{ secrets.CLOUD_RUN_REGION }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REPO_PATH: ${{ secrets.ARTIFACT_REGISTRY_REPO_AGENT }}
        run: |
          MCP_IMAGE=${REGION}-docker.pkg.dev/${REPO_PATH}/maps-mcp-service:${GITHUB_SHA}
          gcloud run deploy maps-mcp-service \
            --image ${MCP_IMAGE} \
            --region ${REGION} \
            --platform managed \
            --port 3000

      - name: Deploy Agent to Cloud Run (with MCP URL)
        env:
          REGION: ${{ secrets.CLOUD_RUN_REGION }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REPO_PATH: ${{ secrets.ARTIFACT_REGISTRY_REPO_AGENT }}
        run: |
          AGENT_IMAGE=${REGION}-docker.pkg.dev/${REPO_PATH}/travel-agent-service:${GITHUB_SHA}
          MCP_URL=$(gcloud run services describe maps-mcp-service --region ${REGION} --format 'value(status.url)')
          MCP_TOOL_ENDPOINT="${MCP_URL}/tools/retrieve-google-maps-platform-docs"
          gcloud run deploy travel-agent-service \
            --image ${AGENT_IMAGE} \
            --region ${REGION} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},GEMINI_MODEL=gemini-2.5-flash,MAPS_MCP_ENDPOINT_URL=${MCP_TOOL_ENDPOINT},MAPS_MCP_AUDIENCE=${MCP_URL}

      - name: Grant Agent SA invoker on MCP service
        env:
          REGION: ${{ secrets.CLOUD_RUN_REGION }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          # Get agent service account
          AGENT_SA=$(gcloud run services describe travel-agent-service --region ${REGION} --format 'value(spec.template.spec.serviceAccountName)')
          if [ -z "$AGENT_SA" ]; then
            PN=$(gcloud projects describe ${PROJECT_ID} --format 'value(projectNumber)')
            AGENT_SA="${PN}-compute@developer.gserviceaccount.com"
          fi
          echo "Granting roles/run.invoker to ${AGENT_SA} on maps-mcp-service"
          gcloud run services add-iam-policy-binding maps-mcp-service \
            --region ${REGION} \
            --member serviceAccount:${AGENT_SA} \
            --role roles/run.invoker

      - name: Propagate AGENT_BASE_URL to backend (travel-quiz-app)
        env:
          REGION: ${{ secrets.CLOUD_RUN_REGION }}
        run: |
          set -e
          # Get deployed agent service URL
          AGENT_URL=$(gcloud run services describe travel-agent-service --region ${REGION} --format 'value(status.url)' || true)
          if [ -z "$AGENT_URL" ]; then
            echo "Agent URL could not be resolved. Skipping propagation."
            exit 0
          fi
          echo "Resolved AGENT_BASE_URL=${AGENT_URL}"
          # Check if backend service exists
          if gcloud run services describe travel-quiz-app --region ${REGION} --format 'value(metadata.name)' >/dev/null 2>&1; then
            gcloud run services update travel-quiz-app \
              --region ${REGION} \
              --update-env-vars=AGENT_BASE_URL=${AGENT_URL}
            echo "Updated travel-quiz-app AGENT_BASE_URL"
          else
            echo "Backend service 'travel-quiz-app' not found. Skipping update."
          fi
