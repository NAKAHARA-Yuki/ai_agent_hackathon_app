name: Deploy to Cloud Run

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-and-mcp:
    # Build & deploy Agent + MCP first so we can pass the URL to the app
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: Build and Deploy Agent + MCP
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      agent_url: ${{ steps.resolve_agent_url.outputs.agent_url }}
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: ${{ secrets.CLOUD_RUN_REGION }}
      REPO_AGENT: ${{ secrets.ARTIFACT_REGISTRY_REPO_AGENT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          export_default_credentials: true

      - name: Configure Docker auth for Artifact Registry
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev -q

      - name: Ensure Artifact Registry repository exists (agent)
        env:
          REGION: ${{ env.REGION }}
          PROJECT_ID: ${{ env.PROJECT_ID }}
          REPO_PATH: ${{ env.REPO_AGENT }}
        run: |
          set -e
          REPO_NAME=$(echo "${REPO_PATH}" | awk -F'/' '{print $2}')
          if [ -z "${REPO_NAME}" ]; then
            echo "ARTIFACT_REGISTRY_REPO_AGENT must be '<PROJECT_ID>/<REPOSITORY_NAME>'" >&2
            exit 1
          fi
          if ! gcloud artifacts repositories describe "${REPO_NAME}" --location="${REGION}" >/dev/null 2>&1; then
            echo "Creating Artifact Registry repo: ${REPO_NAME} in ${REGION}"
            if ! gcloud artifacts repositories create "${REPO_NAME}" \
                --repository-format=docker \
                --location="${REGION}" \
                --description="ai_agent_hackathon_app agent images"; then
              echo "WARN: No permission to create Artifact Registry repo for agent." >&2
            fi
          else
            echo "Artifact Registry repo exists: ${REPO_NAME} (${REGION})"
          fi

      - name: Build and push agent image
        env:
          REGION: ${{ env.REGION }}
          REPO_PATH: ${{ env.REPO_AGENT }}
        run: |
          set -e
          AGENT_IMAGE=${REGION}-docker.pkg.dev/${REPO_PATH}/travel-agent-service:${GITHUB_SHA}
          docker build -t ${AGENT_IMAGE} agent
          docker push ${AGENT_IMAGE}

      - name: Deploy Agent to Cloud Run
        env:
          REGION: ${{ env.REGION }}
        run: |
          AGENT_IMAGE=${REGION}-docker.pkg.dev/${{ env.REPO_AGENT }}/travel-agent-service:${GITHUB_SHA}
          gcloud run deploy travel-agent-service \
            --image ${AGENT_IMAGE} \
            --region ${REGION} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},GEMINI_MODEL=gemini-2.5-pro,GOOGLE_GENAI_USE_VERTEXAI=TRUE,VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Resolve Agent URL
        id: resolve_agent_url
        env:
          REGION: ${{ env.REGION }}
        run: |
          set -e
          URL=$(gcloud run services describe travel-agent-service --region ${REGION} --format 'value(status.url)')
          echo "agent_url=${URL}" >> $GITHUB_OUTPUT

  build-and-deploy:
    needs: agent-and-mcp
    # Extra guard: run only on main branch or manual dispatch
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: ${{ secrets.CLOUD_RUN_REGION }}
      SERVICE: travel-quiz-app
      REPO: ${{ secrets.ARTIFACT_REGISTRY_REPO_APP }}
      IMAGE: ${{ secrets.ARTIFACT_REGISTRY_REPO_APP }}/travel-quiz-app:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          export_default_credentials: true

      - name: Configure Docker auth for Artifact Registry
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev -q

      - name: Ensure Artifact Registry repository exists
        env:
          REGION: ${{ env.REGION }}
          PROJECT_ID: ${{ env.PROJECT_ID }}
          REPO_PATH: ${{ env.REPO }}
        run: |
          set -e
          REPO_NAME=$(echo "${REPO_PATH}" | awk -F'/' '{print $2}')
          if [ -z "${REPO_NAME}" ]; then
            echo "ARTIFACT_REGISTRY_REPO must be '<PROJECT_ID>/<REPOSITORY_NAME>' (e.g., my-proj/containers)" >&2
            exit 1
          fi
          if ! gcloud artifacts repositories describe "${REPO_NAME}" --location="${REGION}" >/dev/null 2>&1; then
            echo "Creating Artifact Registry repo: ${REPO_NAME} in ${REGION}"
            if ! gcloud artifacts repositories create "${REPO_NAME}" \
                --repository-format=docker \
                --location="${REGION}" \
                --description="ai_agent_hackathon_app images"; then
              echo "WARN: No permission to create Artifact Registry repo. Please pre-create '${REPO_NAME}' or grant 'roles/artifactregistry.admin' to the deploying SA." >&2
            fi
          else
            echo "Artifact Registry repo exists: ${REPO_NAME} (${REGION})"
          fi

      - name: Build Docker image
        run: |
          docker build -t ${REGION}-docker.pkg.dev/${IMAGE} .

      - name: Push Docker image
        run: |
          docker push ${REGION}-docker.pkg.dev/${IMAGE}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${SERVICE} \
            --image=${REGION}-docker.pkg.dev/${IMAGE} \
            --region=${REGION} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --max-instances=3 \
            --set-env-vars=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},JWT_SECRET=${{ secrets.JWT_SECRET }},GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }},AGENT_BASE_URL=${{ needs.agent-and-mcp.outputs.agent_url }}

      - name: Resolve App URL
        id: resolve_app_url
        env:
          REGION: ${{ env.REGION }}
          SERVICE: ${{ env.SERVICE }}
        run: |
          set -e
          APP_URL=$(gcloud run services describe ${SERVICE} --region ${REGION} --format 'value(status.url)')
          if [ -z "${APP_URL}" ]; then
            echo "Failed to resolve app service URL" >&2
            exit 1
          fi
          echo "app_url=${APP_URL}" >> $GITHUB_OUTPUT

      - name: Update Agent with APP_SERVER_BASE
        env:
          REGION: ${{ env.REGION }}
          APP_URL: ${{ steps.resolve_app_url.outputs.app_url }}
        run: |
          set -e
          if [ -z "${APP_URL}" ]; then
            echo "APP_URL is empty; cannot update Agent env" >&2
            exit 1
          fi
          # Update Agent service to include APP_SERVER_BASE without overwriting other env vars
          gcloud run services update travel-agent-service \
            --region ${REGION} \
            --update-env-vars=APP_SERVER_BASE=${APP_URL}
