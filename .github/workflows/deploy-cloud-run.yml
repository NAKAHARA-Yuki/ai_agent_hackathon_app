name: Deploy to Cloud Run

on:
  pull_request:
    branches: [ main ]
    types: [ closed ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Only when PR to main is merged
    if: github.event.pull_request.merged == true
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: ${{ secrets.CLOUD_RUN_REGION }}
      SERVICE: travel-quiz-app
      REPO: ${{ secrets.ARTIFACT_REGISTRY_REPO }}
      IMAGE: ${{ secrets.ARTIFACT_REGISTRY_REPO }}/travel-quiz-app:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          export_default_credentials: true

      - name: Auth with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Configure Docker auth for Artifact Registry
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev -q

      - name: Ensure Artifact Registry repository exists
        env:
          REGION: ${{ env.REGION }}
          PROJECT_ID: ${{ env.PROJECT_ID }}
          REPO_PATH: ${{ env.REPO }}
        run: |
          set -e
          REPO_NAME=$(echo "${REPO_PATH}" | awk -F'/' '{print $2}')
          if [ -z "${REPO_NAME}" ]; then
            echo "ARTIFACT_REGISTRY_REPO must be '<PROJECT_ID>/<REPOSITORY_NAME>' (e.g., my-proj/containers)" >&2
            exit 1
          fi
          if ! gcloud artifacts repositories describe "${REPO_NAME}" --location="${REGION}" >/dev/null 2>&1; then
            echo "Creating Artifact Registry repo: ${REPO_NAME} in ${REGION}"
            gcloud artifacts repositories create "${REPO_NAME}" \
              --repository-format=docker \
              --location="${REGION}" \
              --description="ai_agent_hackathon_app images"
          else
            echo "Artifact Registry repo exists: ${REPO_NAME} (${REGION})"
          fi

      - name: Build Docker image
        run: |
          docker build -t ${REGION}-docker.pkg.dev/${IMAGE} .

      - name: Push Docker image
        run: |
          docker push ${REGION}-docker.pkg.dev/${IMAGE}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${SERVICE} \
            --image=${REGION}-docker.pkg.dev/${IMAGE} \
            --region=${REGION} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --max-instances=3 \
            --set-env-vars=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},JWT_SECRET=${{ secrets.JWT_SECRET }},GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
